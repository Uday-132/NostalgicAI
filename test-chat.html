<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NostalgicAI Chat Test</title>
    <style>
        :root {
            --color-primary: #00ffff;
            --color-secondary: #ff00ff;
            --color-accent: #ffff00;
            --color-text: #ffffff;
            --color-text-dim: #aaaaaa;
            --color-bg: rgba(0, 0, 30, 0.95);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: var(--color-bg);
            color: var(--color-text);
            height: 100vh;
            overflow: hidden;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        h1 {
            text-align: center;
            color: var(--color-primary);
            margin-bottom: 20px;
        }

        .api-key-container {
            background: rgba(10, 10, 30, 0.85);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid var(--color-accent);
        }

        .api-key-container label {
            display: block;
            margin-bottom: 10px;
            color: var(--color-text);
        }

        .api-key-container input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--color-accent);
            background: rgba(0, 0, 0, 0.5);
            color: var(--color-text);
            font-family: 'Courier New', monospace;
            font-size: 1rem;
            margin-bottom: 10px;
        }

        .api-key-container button {
            padding: 12px 20px;
            border-radius: 8px;
            background: var(--color-accent);
            color: #000;
            font-weight: bold;
            border: none;
            cursor: pointer;
            font-family: 'Courier New', monospace;
        }

        .chat-app {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(10, 10, 30, 0.85);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--color-primary);
        }

        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: rgba(0, 0, 0, 0.3);
        }

        /* Scrollbar styling */
        .messages-area::-webkit-scrollbar {
            width: 8px;
        }

        .messages-area::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.1);
            border-radius: 4px;
        }

        .messages-area::-webkit-scrollbar-thumb {
            background: var(--color-primary);
            border-radius: 4px;
        }

        .messages-area::-webkit-scrollbar-thumb:hover {
            background: var(--color-secondary);
        }

        .message {
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 8px;
            max-width: 80%;
            word-wrap: break-word;
            animation: fadeIn 0.2s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .user-message {
            background: rgba(0, 255, 255, 0.2);
            margin-left: auto;
            text-align: right;
        }

        .ai-message {
            background: rgba(255, 0, 255, 0.2);
            margin-right: auto;
        }

        .message-role {
            font-weight: bold;
            font-size: 0.8rem;
            margin-bottom: 5px;
        }

        .user-message .message-role {
            color: var(--color-primary);
        }

        .ai-message .message-role {
            color: var(--color-secondary);
        }

        .input-area {
            display: flex;
            padding: 20px;
            background: rgba(0, 0, 0, 0.5);
            gap: 10px;
        }

        .message-input {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--color-accent);
            background: rgba(0, 0, 0, 0.5);
            color: var(--color-text);
            font-family: 'Courier New', monospace;
            font-size: 1rem;
        }

        .send-button {
            padding: 12px 20px;
            border-radius: 8px;
            background: var(--color-accent);
            color: #000;
            font-weight: bold;
            border: none;
            cursor: pointer;
            font-family: 'Courier New', monospace;
        }

        .status-bar {
            padding: 10px 20px;
            text-align: right;
            font-size: 0.8rem;
            background: rgba(0, 0, 0, 0.5);
            border-top: 1px solid var(--color-primary);
        }

        .status-processing {
            color: var(--color-secondary);
        }

        .status-ready {
            color: var(--color-text-dim);
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>NostalgicAI Chat Test</h1>

        <div class="api-key-container">
            <label for="apiKey">Groq API Key:</label>
            <input type="password" id="apiKey" placeholder="Enter your Groq API key" value="">
            <button id="saveApiKey">Save API Key</button>
        </div>

        <div class="chat-app">
            <div class="messages-area" id="messagesArea">
                <div class="message ai-message">
                    <div class="message-role">AI</div>
                    <div class="message-content">Hello! I'm NostalgicAI Chat. How can I assist you today?</div>
                </div>
            </div>

            <div class="input-area">
                <input type="text" class="message-input" id="messageInput" placeholder="Type your message...">
                <button class="send-button" id="sendButton">SEND</button>
            </div>

            <div class="status-bar">
                <span class="status-ready" id="statusText">STATUS: READY</span>
            </div>
        </div>
    </div>

    <script>
        // DOM Elements
        const messagesArea = document.getElementById('messagesArea');
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');
        const statusText = document.getElementById('statusText');
        const apiKeyInput = document.getElementById('apiKey');
        const saveApiKeyButton = document.getElementById('saveApiKey');

        // Get API key from localStorage or use the provided one
        let GROQ_API_KEY = '';
        const GROQ_API_URL = 'https://api.groq.com/openai/v1/chat/completions';

        // System prompt for the chatbot
        const SYSTEM_PROMPT = "You are NostalgicAI, a helpful and witty AI assistant with a retro-futuristic personality. You are powered by the Llama 3.3 Versatile model. You can help with coding, writing, and analysis. Keep responses concise and helpful.";

        // Chat history
        let chatHistory = [
            { role: 'assistant', content: 'Hello! I\'m NostalgicAI Chat. How can I assist you today?' }
        ];

        // Set API key in input field
        apiKeyInput.value = GROQ_API_KEY;

        // Save API key handler
        saveApiKeyButton.addEventListener('click', () => {
            GROQ_API_KEY = apiKeyInput.value.trim();
            localStorage.setItem('GROQ_API_KEY', GROQ_API_KEY);
            alert('API Key saved!');
        });

        // Send message handler
        const sendMessage = async () => {
            const message = messageInput.value.trim();
            if (!message) return;

            // Add user message to history
            const userMessage = { role: 'user', content: message };
            chatHistory.push(userMessage);

            // Add user message to UI
            addMessageToUI('user', message);
            messageInput.value = '';

            // Update status
            updateStatus('PROCESSING...', true);

            try {
                // Get AI response
                const response = await getAIResponse(message);

                // Add AI message to history
                const aiMessage = { role: 'assistant', content: response };
                chatHistory.push(aiMessage);

                // Add AI response to UI
                addMessageToUI('ai', response);

                // Update status
                updateStatus('READY', false);
            } catch (error) {
                const errorMessage = `Error: ${error.message}`;
                addMessageToUI('ai', errorMessage);
                updateStatus('ERROR', true);
            }
        };

        // Get AI response from Groq API
        async function getAIResponse(userMessage) {
            if (!GROQ_API_KEY) {
                throw new Error('Missing Groq API Key. Please enter your API key and save it.');
            }

            try {
                // Prepare messages for API
                const messages = [
                    { role: 'system', content: SYSTEM_PROMPT },
                    ...chatHistory.filter(msg => msg.role !== 'system')
                ];

                // Call Groq API
                const response = await fetch(GROQ_API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${GROQ_API_KEY}`
                    },
                    body: JSON.stringify({
                        model: 'llama-3.3-70b-versatile',
                        messages: messages,
                        temperature: 0.7,
                        max_tokens: 1024
                    })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error?.message || 'API Request Failed');
                }

                const data = await response.json();
                return data.choices[0]?.message?.content || "No response received.";
            } catch (error) {
                console.error("Groq API Error:", error);
                throw error;
            }
        }

        // Add message to UI
        function addMessageToUI(role, content) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}-message`;

            const roleDiv = document.createElement('div');
            roleDiv.className = 'message-role';
            roleDiv.textContent = role === 'user' ? 'YOU' : 'AI';

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.textContent = content;

            messageDiv.appendChild(roleDiv);
            messageDiv.appendChild(contentDiv);
            messagesArea.appendChild(messageDiv);

            // Scroll to bottom smoothly
            setTimeout(() => {
                messagesArea.scrollTo({
                    top: messagesArea.scrollHeight,
                    behavior: 'smooth'
                });
            }, 100);
        }

        // Update status text
        function updateStatus(text, isProcessing) {
            statusText.textContent = `STATUS: ${text}`;
            statusText.className = isProcessing ? 'status-processing' : 'status-ready';
        }

        // Event listeners
        sendButton.addEventListener('click', sendMessage);

        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        // Focus input on load
        window.addEventListener('load', () => {
            messageInput.focus();
        });
    </script>
</body>

</html>
